name: TJSV shared public contracts

on:
  pull_request:
    paths:
      - "validation/**"
      - ".github/workflows/tjsv-public.yml"
  push:
    branches: [main]
    paths:
      - "validation/**"
      - ".github/workflows/tjsv-public.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-otel-public-tjsv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Verify exact candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out reviewed TJSV consumer-verification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 2281843126ab644607b11cf8281d84f382d68dfc
          path: .deps/tjsv
          persist-credentials: false
          show-progress: false

      - name: Verify exact TJSV revision
        run: test "$(git -C .deps/tjsv rev-parse HEAD)" = "2281843126ab644607b11cf8281d84f382d68dfc"

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.16.0"
          package-manager-cache: false

      - name: Install the validator lockfile graph
        run: npm ci --prefix .deps/tjsv --no-audit --no-fund

      - name: Verify current public-contract admission policy
        run: node validation/tjsv/admission.mjs

      - name: Run public-contract admission regressions
        run: node --test validation/tjsv/admission.test.mjs

      - name: Require clean authored and toolchain sources
        run: |
          set -euo pipefail
          git diff --exit-code HEAD
          git -C .deps/tjsv diff --exit-code HEAD
