name: TJSV shared public contracts
on:
  pull_request:
    paths: ['validation/**', '.github/workflows/tjsv-public.yml']
  push:
    branches: [main]
    paths: ['validation/**', '.github/workflows/tjsv-public.yml']
permissions:
  contents: read
jobs:
  public-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact reviewed head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 4473504c4c9d2831d825919f70c03994d8ce01d2
          path: .deps/tjsv
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.16.0'
      - run: npm ci --prefix .deps/tjsv
      - run: node validation/tjsv/admission.mjs
      - run: node --test validation/tjsv/admission.test.mjs
      - name: Require clean authored and toolchain sources
        run: |
          git diff --exit-code HEAD
          git -C .deps/tjsv diff --exit-code HEAD
