name: conformance-boundary

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'conformance/**'
      - 'artifacts/conformance/evidence/**'
      - '.github/workflows/conformance-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'conformance/**'
      - 'artifacts/conformance/evidence/**'
      - '.github/workflows/conformance-boundary.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check conformance boundary
        run: |
          node --check conformance/check.mjs
          node conformance/check.mjs
          node --test conformance/check.test.mjs
